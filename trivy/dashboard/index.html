<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;transition:background .18s ease,color .18s ease}
body.light{--bg:#f8f9fc;--card:#fff;--card2:#f3f4f8;--brd:#e5e7ee;--brd2:#d1d5e0;--tx:#1a1c2e;--tx2:#5c5f78;--tx3:#9b9db3;--acc:#5558e6;--accbg:#5558e612;--shd:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);--sc:#dc2645;--scb:#dc264510;--sh:#e05520;--shb:#e0552010;--sm:#b45309;--smb:#b4530910;--sl:#2d7dd2;--slb:#2d7dd210;--ok:#0d9668;--okb:#0d966810}

body{background:var(--bg);color:var(--tx)}
.wrap{max-width:1260px;margin:0 auto;padding:28px 20px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.hdr h1{font-size:22px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.hdr h1 svg{color:var(--acc)}.hdr-sub{font-size:12px;color:var(--tx3);margin-top:3px}
.hdr-r{display:flex;gap:8px;align-items:center}
.btn-icon{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);transition:all .18s ease}.btn-icon:hover{border-color:var(--acc);color:var(--acc)}

.sum-val{font-size:24px;font-weight:700;letter-spacing:-.5px}.sum-lbl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px}

.chart-wrap{background:var(--card);border:1px solid var(--brd);border-radius:14px;margin-bottom:20px;overflow:hidden;transition:all .18s ease}
.chart-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;user-select:none}

.tab:hover{color:var(--tx)}.tab.on{background:var(--acc);color:#fff}
.tab-n{font-size:10px;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.2);font-weight:700}
.tab:not(.on) .tab-n{background:var(--card2);color:var(--tx3)}
.chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--brd);background:transparent;font-family:inherit;font-size:12px;color:var(--tx2);cursor:pointer;transition:all .18s ease}
.chip:hover{border-color:var(--acc)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip-clear{padding:5px 12px;border-radius:20px;border:1px solid var(--brd);background:var(--card2);font-family:inherit;font-size:11px;color:var(--tx3);cursor:pointer}
.search-row{display:flex;gap:8px;margin-bottom:14px}

.search input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--tx)}.search input::placeholder{color:var(--tx3)}
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mcard{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:18px;cursor:pointer;transition:all .18s ease;animation:fu .3s ease both;position:relative;overflow:hidden}
.mcard:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--shd)}
.mcard-dim{opacity:.45;cursor:default}.mcard-dim:hover{border-color:var(--brd);transform:none;box-shadow:none}
.mcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.mcard-name{font-size:15px;font-weight:700}.mcard-role{font-size:11px;color:var(--tx3);margin-top:2px}
.mcard-bar{display:flex;gap:8px;flex-wrap:wrap}
.mcard-sev{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
.mcard-stripe{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);cursor:pointer;margin-bottom:14px;padding:6px 0;border:none;background:none;font-family:inherit;transition:color .18s ease}.back:hover{color:var(--acc)}
.count-txt{font-size:12px;color:var(--tx2);margin-bottom:10px;padding-left:2px}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{background:var(--card);border:1px solid var(--brd);border-radius:14px;overflow:hidden;transition:all .18s ease;animation:fu .25s ease both}
.vrow:hover{border-color:var(--brd2)}.vrow.open{border-color:var(--acc)}
.vhdr{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;gap:12px}
.vl{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.sev-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.3px;flex-shrink:0;text-transform:uppercase}
.v-info{min-width:0}.v-id{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
.v-title{font-size:12px;color:var(--tx);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.vr{display:flex;align-items:center;gap:8px;flex-shrink:0;color:var(--tx3);flex-wrap:wrap}
.v-pkg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);font-family:'JetBrains Mono',monospace}
.v-mtags{display:flex;gap:3px}.v-mtag{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;color:#fff}

.vdetail{border-top:1px solid var(--brd);padding:18px 16px;animation:fu .2s ease both}
.ds{margin-bottom:18px}.ds:last-child{margin-bottom:0}
.ds-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);margin-bottom:8px;display:flex;align-items:center;gap:6px}

.conflict-card{background:var(--card2);border:1px solid var(--brd);border-radius:8px;padding:14px;margin-top:8px}

.ver-row{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap}

.img-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.dep-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.dep-tag{font-size:11px;padding:3px 8px;border-radius:5px;background:var(--accbg);color:var(--acc);font-family:'JetBrains Mono',monospace}
.detail-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--acc);text-decoration:none;font-weight:500;margin-top:12px}.detail-link:hover{opacity:.7}
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-bubble{position:absolute;z-index:100;background:var(--tx);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:11px;line-height:1.5;max-width:280px;width:max-content;pointer-events:none;white-space:normal;box-shadow:0 4px 12px rgba(0,0,0,.15);bottom:100%;left:0;margin-bottom:6px}
.info-dot{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:var(--tx3);cursor:help;transition:color .18s ease}.info-dot:hover{color:var(--acc)}
.empty{text-align:center;padding:60px 20px;color:var(--tx3)}.empty svg{margin-bottom:10px;opacity:.3}.empty p{font-size:13px}
.sentinel{height:1px}
@media(max-width:768px){.machines{grid-template-columns:1fr}.vhdr{flex-direction:column;align-items:flex-start}.vr{flex-wrap:wrap}.v-title{max-width:240px}.summary{flex-direction:column}.tabs{flex-wrap:wrap}.ver-row{flex-direction:column;gap:8px}.cc-row{flex-direction:column;gap:4px}.cc-label{min-width:auto}}

.scroll-top{position:fixed;bottom:24px;right:24px;width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:all .25s ease;z-index:999;font-size:18px}
.scroll-top.show{opacity:1;pointer-events:auto}
.scroll-top:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(0,0,0,.3)}

.banner{background:var(--accbg);border:1px solid var(--acc);border-radius:14px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;animation:fu .3s ease both;position:relative}
.banner-body{flex:1;font-size:16px;color:var(--tx);line-height:1.6}
.banner-title{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--acc);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.banner-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--tx3);cursor:pointer;padding:4px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .18s}.banner-close:hover{color:var(--sc);background:var(--scb)}
.banner-stats{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.banner-stat{font-size:14px;color:var(--tx3)}
.banner-stat b{color:var(--tx);font-weight:700;font-size:16px}
</style>
</head>

const dk=document.body.classList.contains('dark');
const gc=dk?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)',tc=dk?'#8b8fa3':'#5c5f78';
const ds=[
{label:'Total',data:history.map(h=>h.total),borderColor:'#6c72ff',backgroundColor:'#6c72ff18',fill:true,tension:.3,pointStyle:'circle',yAxisID:'y'},
{label:'Críticos',data:history.map(h=>h.critical),borderColor:'#ef4444',backgroundColor:'#ef444418',fill:false,tension:.3,pointStyle:'rectRot',yAxisID:'y1'},
{label:'Altos',data:history.map(h=>h.high),borderColor:'#f97316',backgroundColor:'#f9731618',fill:false,tension:.3,pointStyle:'triangle',yAxisID:'y'},
{label:'Medios',data:history.map(h=>h.medium),borderColor:'#eab308',backgroundColor:'#eab30818',fill:false,tension:.3,borderDash:[6,3],pointStyle:'rect',yAxisID:'y1'}];
ds.forEach((d,i)=>{const on=!chartSev||SK[i]===chartSev||chartSev==='ALL';d.borderWidth=on?(i?2.5:3):1;d.pointRadius=on?5:2;if(!on){d.borderColor=d.borderColor.slice(0,7)+'40';d.backgroundColor='transparent'}});
chartRef.current=new Chart(canvasRef.current,{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
onHover:(e,els,ch)=>{if(els.length){const hi=els[0].datasetIndex;ch.data.datasets.forEach((d,i)=>{d.borderWidth=i===hi?(i?3.5:4):1;d.pointRadius=i===hi?6:2});ch.update('none')}else{ch.data.datasets.forEach((d,i)=>{const on=!chartSev||SK[i]===chartSev||chartSev==='ALL';d.borderWidth=on?(i?2.5:3):1;d.pointRadius=on?5:2});ch.update('none')}},
onClick:(e,els)=>{if(els.length)onSevClick(SK[els[0].datasetIndex])},
plugins:{legend:{position:'top',labels:{color:tc,font:{family:'DM Sans',size:12,weight:'500'},usePointStyle:true,padding:20},onClick:(e,item)=>onSevClick(SK[item.datasetIndex])},
tooltip:{backgroundColor:dk?'#1a1d28':'#fff',titleColor:dk?'#e6e8f0':'#1a1c2e',bodyColor:dk?'#8b8fa3':'#5c5f78',borderColor:dk?'#22253a':'#e5e7ee',borderWidth:1,padding:12,cornerRadius:8,titleFont:{family:'DM Sans',weight:'600'},bodyFont:{family:'DM Sans'},callbacks:{title:i=>i[0]?.label||'',label:c=>' '+c.dataset.label+': '+c.parsed.y}}},
scales:{x:{grid:{color:gc},ticks:{color:tc,font:{family:'DM Sans',size:11}}},y:{type:'linear',position:'left',beginAtZero:true,grid:{color:gc},ticks:{color:tc,font:{family:'DM Sans',size:11}},title:{display:true,text:'Total / Altos',color:tc,font:{family:'DM Sans',size:11}}},y1:{type:'linear',position:'right',beginAtZero:true,grid:{drawOnChartArea:false},ticks:{color:tc,font:{family:'DM Sans',size:11}},title:{display:true,text:'Críticos / Medios',color:tc,font:{family:'DM Sans',size:11}}}},
animation:{duration:600,easing:'easeOutQuart'}}});
return()=>{if(chartRef.current)chartRef.current.destroy()};
},[history,chartSev]);
if(!history||!history.length)return null;
return <div style={{height:280}}><canvas ref={canvasRef}/></div>;
}

{v.exposed&&<div style={{fontSize:11,padding:'8px 12px',borderRadius:8,background:'var(--scb)',border:'1px solid var(--sc)',color:'var(--sc)',marginBottom:10,display:'flex',alignItems:'center',gap:6}}>🌐 <strong>Expuesto a internet</strong>{v.exposedDomains&&<span style={{marginLeft:4}}>via {v.exposedDomains.join(', ')}</span>}</div>}<div style={{fontSize:12,color:'var(--tx2)',marginBottom:6}}>{(v.machines||[]).map(m=>{const imgs=v.machine_images&&v.machine_images[m]||[];const info=data?.image_info||{};return <div key={m} style={{marginBottom:8}}><span style={{fontWeight:600,color:MACHINES[m]?.color||'var(--tx)'}}>{m}</span>{imgs.length>0&&<div className="img-list">{imgs.map(img=>{const meta=info[m+':'+img];return <Tip key={img} text={meta?meta.path+' → servicio: '+meta.service:''}><span className="img-tag">{esc(img)}{meta&&meta.service&&<span style={{color:'var(--tx3)',marginLeft:4}}>({meta.service})</span>}</span></Tip>})}</div>}</div>})}</div></div>
{v.dependsOn&&v.dependsOn.length>0&&<div className="ds"><div className="ds-t"><IC.Link s={13}/> Paquetes dependientes <InfoDot text="Si actualizamos, estos pueden verse afectados."/></div><div className="dep-list">{v.dependsOn.map(d=><span key={d} className="dep-tag">{esc(d)}</span>)}</div></div>}

<div className="ds"><div className="ds-t"><IC.Wrench s={13}/> ¿Qué hacer? <InfoDot text="Pasos para arreglar."/></div>{v.howToFix?<div className={'fix-box '+(v.hasConflict?'warn':!v.fixed?'nofix':'safe')}>{v.howToFix}</div>:v.fixed?<div className="fix-box safe">Actualizar {esc(v.pkg)} de {esc(v.installed)} a {esc(v.fixed)}</div>:<div className="fix-box nofix">Sin solución disponible. Monitorizar actualizaciones del proveedor.</div>}</div>

<a className="detail-link" href={'https://nvd.nist.gov/vuln/detail/'+encodeURIComponent(v.id)} target="_blank" rel="noopener noreferrer"><IC.Ext s={12}/> Más información (NVD)</a>
</div>}
</div>;}

function App(){
const[dark,setDark]=useState(false);const[data,setData]=useState(null);const[loading,setLoading]=useState(true);
const[tab,setTab]=useState(null);const[search,setSearch]=useState('');const[sevFilter,setSevFilter]=useState([]);
const[chartSev,setChartSev]=useState(null);const[expandedId,setExpandedId]=useState(null);const[selMachine,setSelMachine]=useState(null);
const[docsOpen,setDocsOpen]=useState(false);const[resolved,setResolved]=useState([]);const[history,setHistory]=useState([]);
const[chartOpen,setChartOpen]=useState(true);
const[summary,setSummary]=useState(null);
const[bannerDismissed,setBannerDismissed]=useState(()=>{try{const d=window.sessionStorage?.getItem('trivy-banner-v3');return d||''}catch(e){return ''}});const[visibleCount,setVisibleCount]=useState(50);const sentinelRef=useRef(null);

useEffect(()=>{const h=window.location.hash.slice(1);if(!h)return;try{const p=h.split('?');const seg=p[0].split('/');const qs=new URLSearchParams(p[1]||'');

else if(seg[0]==='machines'){setTab('machines');if(seg[1]&&MACHINES[seg[1]])setSelMachine(seg[1]);setChartOpen(false)}
else if(seg[0]==='sev'&&seg[1]){const sv=seg[1];setChartSev(sv);if(sv!=='ALL')setSevFilter([sv])}
if(qs.get('cve'))setExpandedId(decodeURIComponent(qs.get('cve')));
if(qs.get('chart')==='0')setChartOpen(false);
}catch(e){}},[]); 

useEffect(()=>{let h='';const qs=[];
if(tab==='machines'&&selMachine)h='machines/'+selMachine;
else if(tab)h=tab;
else if(chartSev)h='sev/'+chartSev;
if(expandedId)qs.push('cve='+encodeURIComponent(expandedId));
if(!chartOpen)qs.push('chart=0');
const full=h+(qs.length?'?'+qs.join('&'):'');
if(full)window.location.hash=full;else if(window.location.hash)window.history.replaceState(null,null,' ');
},[tab,selMachine,chartSev,expandedId,chartOpen]);

useEffect(()=>{document.body.className=dark?'dark':'light'},[dark]);
useEffect(()=>{fetch('/api/resolved.json').then(r=>r.json()).then(d=>setResolved(d)).catch(()=>{})},[]);
useEffect(()=>{fetch('/api/history.json').then(r=>r.json()).then(d=>setHistory(d)).catch(()=>{})},[]);
useEffect(()=>{fetch('/api/exposed.json').then(r=>r.json()).then(d=>{}).catch(()=>{})},[]);
useEffect(()=>{fetch('/api/summary.json').then(r=>r.json()).then(d=>setSummary(d)).catch(()=>{})},[]);
useEffect(()=>{fetch('/api/latest.json').then(r=>r.json()).then(d=>{updateMachines(d.machines_scanned);setData(d);setLoading(false)}).catch(()=>setLoading(false))},[]);
useEffect(()=>{if(!sentinelRef.current)return;const obs=new IntersectionObserver(e=>{if(e[0].isIntersecting)setVisibleCount(p=>p+50)},{rootMargin:'200px'});obs.observe(sentinelRef.current);return()=>obs.disconnect()});

const vulns=data?.vulnerabilities||[];const vulnsFor=m=>vulns.filter(v=>(v.machines||[]).includes(m));
const actionVulns=vulns.filter(v=>v.fixed);const monitorVulns=vulns.filter(v=>!v.fixed);const conflictVulns=vulns.filter(v=>v.hasConflict);

const currentList=useMemo(()=>{let list=[];
if(tab==='machines'&&selMachine)list=vulnsFor(selMachine);
else if(tab==='action')list=actionVulns;else if(tab==='monitor')list=monitorVulns;
else if(tab==='conflicts')list=conflictVulns;else if(tab==='resolved')list=resolved;
else if(!tab&&chartSev==='ALL')list=vulns;else if(!tab&&chartSev)list=vulns;
else return [];
if(search){const q=search.toLowerCase();list=list.filter(v=>v.id?.toLowerCase().includes(q)||v.pkg?.toLowerCase().includes(q)||v.title?.toLowerCase().includes(q))}
if(sevFilter.length)list=list.filter(v=>sevFilter.includes(v.severity));
return list.sort((a,b)=>{const s=(SEVORD[a.severity]||3)-(SEVORD[b.severity]||3);if(s!==0)return s;if(a.exposed&&!b.exposed)return -1;if(!a.exposed&&b.exposed)return 1;return 0;});
},[tab,selMachine,search,sevFilter,vulns,resolved,chartSev]);

const visibleList=currentList.slice(0,visibleCount);
const resetList=()=>{setSearch('');setExpandedId(null);setVisibleCount(50)};

const handleCardClick=(k)=>{if(chartSev===k){setChartSev(null);setSevFilter([]);if(!tab)resetList()}else{setTab(null);setSelMachine(null);setChartSev(k);setSevFilter(k==='ALL'?[]:[k]);resetList();setChartOpen(true)}};
const handleChartClick=(sk)=>{const k=sk===null?'ALL':sk;handleCardClick(k)};
const handleTabClick=(t)=>{if(tab===t){setTab(null);resetList();return}setTab(t);setSelMachine(null);setSevFilter([]);setChartSev(null);resetList();setChartOpen(false)};

const TABS=[{id:'machines',label:'Máquinas',n:Object.keys(MACHINES).length,tip:'Vista por servidor.'},{id:'action',label:'Actuar',n:actionVulns.length,tip:'Con solución disponible.'},{id:'monitor',label:'Monitorizar',n:monitorVulns.length,tip:'Sin solución disponible.'},{id:'conflicts',label:'Conflictos',n:conflictVulns.length,tip:'Solución puede romper cosas.'},{id:'resolved',label:'Resueltas',n:resolved.length,tip:'Ya no aparecen en el último escaneo.'}];

<div className="summary">{CARDS.map((s,i)=><div className={'sum-card'+(chartSev===s.k?' active':'')} key={i} style={{animationDelay:i*50+'ms'}} onClick={()=>handleCardClick(s.k)}><div className="sum-dot" style={{background:s.c}}/><div><div className="sum-val">{s.v}</div><div className="sum-lbl">{s.l}</div></div></div>)}</div>

{summary&&summary.summary&&bannerDismissed!==summary.date&&<div className="banner">

<div style={{marginBottom:10}}>{summary.summary}</div>

<div className="banner-stat"><b>{summary.total}</b> total {summary.diff_total!==0&&<span style={{color:summary.diff_total>0?'var(--sc)':'var(--ok)'}}> ({summary.diff_total>0?'+':''}{summary.diff_total})</span>}</div>
<div className="banner-stat" style={{color:'var(--sc)'}}><b>{summary.critical}</b> críticos {summary.diff_critical!==0&&<span> ({summary.diff_critical>0?'+':''}{summary.diff_critical})</span>}</div>
<div className="banner-stat">🌐 <b>{summary.exposed}</b> expuestos</div>
<div className="banner-stat" style={{color:'var(--ok)'}}><b>{summary.actionable||0}</b> actualizables</div>

<div className="banner-stat"><b>{summary.conflicts}</b> conflictos</div>
</div>
{summary.resolved>0&&<div style={{marginTop:8,fontSize:13,color:'var(--ok)'}}>✅ Resueltas: {summary.resolved_details?.map(r=>r.pkg).join(', ')||summary.resolved}</div>}
{summary.exposed_crit_pkgs?.length>0&&<div style={{marginTop:4,fontSize:13,color:'var(--sc)'}}>🔴 Prioridad: {summary.exposed_crit_pkgs.join(', ')} (críticos + expuestos)</div>}
{summary.resolved===0&&<div style={{marginTop:4,fontSize:13,color:'var(--tx3)'}}>No se resolvió ninguna vulnerabilidad esta semana.</div>}
</div>
<button className="banner-close" onClick={()=>{setBannerDismissed(summary.date);try{window.sessionStorage?.setItem('trivy-banner-v3',summary.date)}catch(e){}}} title="Cerrar"><IC.X s={14}/></button>
</div>}

{history.length>0&&<div className="chart-wrap">
<div className="chart-hdr" onClick={()=>setChartOpen(!chartOpen)}><div className="chart-title"><IC.Info s={13}/> Tendencia {chartSev&&<span style={{color:'var(--acc)',fontWeight:700}}>— {sevLabels[chartSev]||chartSev}</span>}</div>{chartOpen?<IC.Down s={14}/>:<IC.Right s={14}/>}</div>
{chartOpen&&<><div className="chart-body"><TrendChart history={history} chartSev={chartSev} onSevClick={handleChartClick}/></div><div className="chart-footer">{history.length} escaneos · Desde {new Date(history[0].date).toLocaleDateString('es-ES',{dateStyle:'long'})}</div></>}
</div>}

{!tab&&chartSev&&<div style={{marginBottom:14}}><button className="back" onClick={()=>{setChartSev(null);setSevFilter([]);setVisibleCount(50)}}><IC.Back s={15}/> Limpiar filtro</button></div>}

<div className="tabs">{TABS.map(t=><Tip key={t.id} text={t.tip}><button className={'tab'+(tab===t.id?' on':'')} onClick={()=>handleTabClick(t.id)}>{t.label}<span className="tab-n">{t.n}</span></button></Tip>)}</div>

{((tab&&tab!=='machines')||(tab==='machines'&&selMachine))&&<div className="chips">{['CRITICAL','HIGH','MEDIUM'].map(s=><button key={s} className={'chip'+(sevFilter.includes(s)?' on':'')} onClick={()=>{setSevFilter(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s]);setVisibleCount(50)}}>{SEV[s].label}</button>)}{sevFilter.length>0&&<button className="chip-clear" onClick={()=>{setSevFilter([]);setVisibleCount(50)}}>Limpiar</button>}</div>}

{tab==='machines'&&selMachine&&<><button className="back" onClick={()=>{setSelMachine(null);setSevFilter([]);resetList()}}><IC.Back s={15}/> Volver a máquinas</button><div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}><span style={{fontSize:20}}>{MACHINES[selMachine]?.icon}</span><div><div style={{fontWeight:700,fontSize:16}}>{selMachine}</div><div style={{fontSize:12,color:'var(--tx3)'}}>{MACHINES[selMachine]?.role} · {vulnsFor(selMachine).length} vulnerabilidades</div></div></div></>}

{showList&&<><div className="search-row"><div className="search"><IC.Search s={14}/><input placeholder="Buscar por CVE, paquete o descripción..." value={search} onChange={e=>{setSearch(e.target.value);setVisibleCount(50)}}/>{search&&<span style={{cursor:'pointer',color:'var(--tx3)',display:'flex'}} onClick={()=>setSearch('')}><IC.X s={13}/></span>}</div></div>

<h3 style={{fontSize:15,fontWeight:700,color:'var(--tx)',marginBottom:8,marginTop:0}}>¿Qué es Trivy Security?</h3>
<p style={{marginBottom:16}}>Trivy escanea las imágenes Docker y paquetes del sistema de tu fleet de máquinas buscando vulnerabilidades conocidas (CVEs).</p>
<h3 style={{fontSize:15,fontWeight:700,color:'var(--tx)',marginBottom:8}}>Cómo navegar</h3>
<p style={{marginBottom:6}}><strong style={{color:'var(--acc)'}}>Tarjetas de resumen</strong> — Click filtra por severidad. El gráfico se sincroniza: solo muestra esa línea. Click de nuevo limpia todo.</p>
<p style={{marginBottom:6}}><strong style={{color:'var(--acc)'}}>Gráfico</strong> — Click en línea o leyenda filtra igual que las tarjetas. Hover resalta la línea. Se colapsa al usar pestañas.</p>
<p style={{marginBottom:16}}><strong style={{color:'var(--acc)'}}>Pestañas</strong> — Filtros independientes: Máquinas, Actuar (con fix), Monitorizar (sin fix), Conflictos, Resueltas. Dentro de máquinas y pestañas hay chips de severidad.</p>
<h3 style={{fontSize:15,fontWeight:700,color:'var(--tx)',marginBottom:8}}>Detalle de vulnerabilidad</h3>
<p style={{marginBottom:4}}><strong>1. ¿Qué es?</strong> — Explicación generada por IA en español.</p>
<p style={{marginBottom:4}}><strong>2. ¿Por qué es grave?</strong> — Impacto real en tu infraestructura.</p>
<p style={{marginBottom:4}}><strong>3. Paquete afectado</strong> — Versión actual y corregida.</p>
<p style={{marginBottom:4}}><strong>4. ¿Dónde afecta?</strong> — Máquinas, imágenes Docker y ruta del compose.</p>
<p style={{marginBottom:4}}><strong>5. Dependencias</strong> — Paquetes que usan este.</p>
<p style={{marginBottom:4}}><strong>6. Conflictos</strong> — Riesgo de actualizar.</p>
<p style={{marginBottom:16}}><strong>7. ¿Qué hacer?</strong> — Pasos exactos. Verde=seguro, naranja=cuidado, gris=sin solución.</p>
<h3 style={{fontSize:15,fontWeight:700,color:'var(--tx)',marginBottom:8}}>Memoria</h3>
<p>La URL guarda tu posición: pestaña, máquina, filtro, CVE abierto y estado del gráfico. Al refrescar vuelves donde estabas.</p>
