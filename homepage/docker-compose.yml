services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: soc-homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_GRAFANA_PASS=${GF_ADMIN_PASSWORD}
      - HOMEPAGE_VAR_MONITOR_URL=http://${MONITOR_IP}
      - HOMEPAGE_VAR_MONITOR_IP=${MONITOR_IP}
      - HOMEPAGE_VAR_GRAFANA_PORT=${GF_HTTP_PORT:-3001}
      - HOMEPAGE_VAR_PROMETHEUS_PORT=${PROMETHEUS_PORT:-9090}
      - HOMEPAGE_VAR_WAZUH_PORT=${WAZUH_DASHBOARD_PORT:-5601}
      - HOMEPAGE_VAR_DNS_WEB_PORT=${DNS_WEB_PORT:-2999}
      - HOMEPAGE_VAR_HOMEPAGE_PORT=${HOMEPAGE_PORT:-8082}
    volumes:
      - ./config:/app/config
      - ./images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${MONITOR_IP}:${HOMEPAGE_PORT:-8082}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  default:
    name: soc-monitor-net
    external: true
