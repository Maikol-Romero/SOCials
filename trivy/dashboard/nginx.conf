# ============================================
# Trivy Security Dashboard — Nginx Hardened
# OWASP Top 10 2021 + API Security
# ============================================

# A05: Security Misconfiguration — ocultar versión
server_tokens off;

# Rate limiting — A07: Auth Failures + brute force protection
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── A01: Broken Access Control ──
    # Autenticación obligatoria en todo
    auth_basic "Trivy Security";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Rate limit en autenticación (anti brute force)
    limit_req zone=auth burst=3 nodelay;
    limit_conn conn 10;

    # Bloquear métodos HTTP innecesarios
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # ── A02: Cryptographic Failures ──
    # HSTS (forzar HTTPS en el proxy externo)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── A03: Injection ──
    # Bloquear caracteres peligrosos en URLs
    if ($request_uri ~* "(<|>|'|\"|;|\{|\}|\||\\|\^|~|\[|\]|`)" ) {
        return 403;
    }

    # ── A04: Insecure Design ──
    # Timeouts agresivos
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    # Limitar tamaño de request (dashboard es solo lectura)
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # ── A05: Security Misconfiguration ──
    # Security headers completos
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;

    # CSP estricto
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # No directory listing
    autoindex off;

    # No sniff MIME types
    add_header X-Download-Options "noopen" always;

    # ── A06: Vulnerable Components ──
    # Servido por nginx:alpine (mínimo ataque surface)
    # Dashboard es HTML estático, sin backend dinámico

    # ── A07: Auth Failures ──
    # Respuestas genéricas en errores de auth (no revelar info)
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # ── A08: Software Integrity ──
    # Subresource Integrity — los scripts de CDN se verifican por hash
    # (implementado en el HTML con atributo integrity)

    # ── A09: Logging ──
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # ── A10: SSRF ──
    # No hay backend dinámico, no aplica directamente
    # Pero bloqueamos requests a IPs internas por si acaso
    if ($http_host ~* "169.254|127.0.0|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168") {
        return 403;
    }

    # ── Health check (sin auth) ──
    location = /health {
        auth_basic off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Dashboard (HTML estático) ──
    location / {
        limit_req zone=general burst=10 nodelay;
        try_files $uri $uri/ /index.html;

        # Cache para assets estáticos
        location ~* \.(css|js|woff2|woff|ttf|ico|svg)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API — solo latest.json y history.json ──
    location = /api/latest.json {
        limit_req zone=api burst=5 nodelay;
        alias /data/reports/latest.json;
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location = /api/resolved.json {
        limit_req zone=api burst=5 nodelay;
        alias /data/reports/resolved.json;
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location = /api/history.json {
        limit_req zone=api burst=5 nodelay;
        alias /data/reports/history.json;
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location = /api/summary.json {
        alias /data/reports/summary.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /api/exposed.json {
        alias /data/reports/exposed.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Bloquear TODO lo demás en /api/
    location /api/ {
        return 403;
    }

    # ── Bloqueos ──
    # Archivos ocultos
    location ~ /\. {
        deny all;
        return 404;
    }

    # Archivos de backup, config, etc.
    location ~* \.(txt|log|sql|bak|old|orig|swp|env|conf|yml|yaml|json|sh|py)$ {
        deny all;
        return 404;
    }

    # Paths comunes de ataque
    location ~* (wp-admin|wp-login|wp-content|phpmyadmin|admin\.php|xmlrpc|\.git|\.svn|\.env|\.aws|\.ssh) {
        deny all;
        return 404;
    }

    # Error pages (genéricas, no revelan info del servidor)
    location = /401.html { internal; return 401 '{"error":"unauthorized"}'; }
    location = /403.html { internal; return 403 '{"error":"forbidden"}'; }
    location = /404.html { internal; return 404 '{"error":"not found"}'; }
    location = /50x.html { internal; return 500 '{"error":"server error"}'; }
}
