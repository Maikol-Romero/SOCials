<!--
  ============================================
  Wazuh Manager — Configuración Principal
  ============================================
  - Recibe agentes por la mesh privada (1514/1515)
  - Alertas nivel >= 12 a Discord (webhook configurable)
  - File Integrity Monitoring habilitado
  - Vulnerability detection habilitado
-->

<ossec_config>

  <!-- ============================================
       CONFIGURACIÓN GLOBAL
       ============================================ -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
  </global>

  <!-- ============================================
       REGISTRO DE AGENTES
       ============================================ -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
  </auth>

  <!-- ============================================
       COMUNICACIÓN CON AGENTES
       ============================================ -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- ============================================
       ALERTAS — Niveles
       ============================================
       0-4: Informativo (ignorado)
       5-7: Low
       8-11: Medium
       12-15: High/Critical → Discord
  -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ============================================
       INTEGRACIÓN DISCORD — Solo HIGH/CRITICAL
       ============================================
       Envia alertas nivel >= 12 al webhook de Discord.
       El script custom-discord.py formatea el mensaje.
  -->
  <integration>
    <name>slack</name>
    <hook_url>https://discord.com/api/webhooks/REPLACE_WITH_YOUR_WEBHOOK_ID/REPLACE_WITH_YOUR_WEBHOOK_TOKEN/slack</hook_url>
    <level>12</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- ============================================
       FILE INTEGRITY MONITORING (FIM)
       ============================================
       Monitoriza cambios en archivos críticos del sistema.
       Frecuencia: cada 12 horas (43200 segundos).
       Alertas en tiempo real para directorios sensibles.
  -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Directorios críticos a monitorizar -->
    <directories realtime="yes" check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories realtime="yes" check_all="yes">/bin,/sbin</directories>

    <!-- Ignorar archivos que cambian constantemente -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/prelink.cache</ignore>

    <!-- No seguir enlaces simbólicos -->
    <auto_ignore frequency="10" timeframe="3600">yes</auto_ignore>
  </syscheck>

  <!-- ============================================
       ROOTKIT DETECTION
       ============================================ -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- ============================================
       VULNERABILITY DETECTION
       ============================================
       Escanea paquetes instalados contra base de datos de CVEs.
  -->

  <!-- ============================================
       LOG ANALYSIS — Reglas y decodificadores
       ============================================ -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
  </ruleset>

  <!-- ============================================
       LOG COLLECTION — Manager local
       ============================================ -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- ============================================
       ACTIVE RESPONSE — SSH Brute Force
       ============================================
       5 intentos fallidos → bloqueo 30 minutos via iptables.
       Solo afecta SSH. Claves SSH nunca disparan esto.
  -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712,5720,5763</rules_id>
    <timeout>1800</timeout>
  </active-response>



  <!-- Vulnerability detection (Wazuh 4.8+) -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <!-- Indexer connector (credentials in keystore) -->
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://wazuh.indexer:9200</host>
    </hosts>
    <ssl>
      <certificate>/etc/ssl/admin.pem</certificate>
      <key>/etc/ssl/admin-key.pem</key>
    </ssl>
  </indexer>
</ossec_config>
