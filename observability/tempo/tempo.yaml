# ============================================
# Tempo — Motor de Trazas Distribuidas
# ============================================
# Recibe trazas OTLP gRPC desde el OTEL Collector de la fleet.
# metrics_generator genera métricas RED (Rate, Errors, Duration)
# automáticamente desde las trazas, que Prometheus scrapea.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
  ring:
    kvstore:
      store: inmemory

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  max_block_duration: 5m

# metrics_generator: Analiza cada traza y genera métricas automáticas.
# - span_metrics: duración y count por servicio/operación
# - service_graphs: grafo de dependencias entre servicios
# Prometheus scrapea estas métricas en :3200/metrics
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: observability
  processor:
    span_metrics:
      dimensions:
        - service.name
        - http.method
        - http.status_code
    service_graphs:
      dimensions:
        - service.name
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Límites de búsqueda
query_frontend:
  search:
    max_duration: 720h

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
