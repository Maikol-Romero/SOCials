# ============================================
# Stack de Observabilidad
# ============================================
# Prometheus: métricas | Loki: logs | Tempo: trazas | Grafana: visualización
# Blackbox: healthchecks HTTP
# Todos los puertos bindean a ${MONITOR_IP} — apunta a la mesh privada (VPN).
# Variables en .env

services:
  prometheus:
    image: prom/prometheus:v3.11.1
    container_name: soc-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-remote-write-receiver'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${MONITOR_IP}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitor-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  loki:
    image: grafana/loki:3.6.10
    container_name: soc-loki
    command: [ "-config.file=/etc/loki/loki.yaml" ]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "${MONITOR_IP}:${LOKI_PORT:-3100}:3100"
    networks:
      - monitor-net
    restart: unless-stopped
    healthcheck:
      disable: true
      retries: 3
      start_period: 30s

  tempo:
    image: grafana/tempo:2.10.3
    container_name: soc-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${MONITOR_IP}:${TEMPO_HTTP_PORT:-3200}:3200"
      - "${MONITOR_IP}:${TEMPO_GRPC_PORT:-4317}:4317"
    networks:
      - monitor-net
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy


  grafana:
    image: grafana/grafana:12.4.2
    container_name: soc-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3001/}
      - GF_FEATURE_TOGGLES_ENABLE=traceToLogs,traceToMetrics
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${MONITOR_IP}:${GF_HTTP_PORT:-3001}:3000"
    networks:
      - monitor-net
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: soc-blackbox
    ports:
      - "${MONITOR_IP}:9115:9115"
    networks:
      - monitor-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/metrics" ]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.11.0
    container_name: soc-node-exporter
    pid: host
    privileged: true
    volumes:
      - /:/host:ro,rslave
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    command:
      - '--path.rootfs=/host'
      - '--collector.processes'
      - '--collector.systemd'
    ports:
      - "${MONITOR_IP}:9100:9100"
    networks:
      - monitor-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: soc-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--store_container_labels=true'
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
    ports:
      - "${MONITOR_IP}:8080:8080"
    networks:
      - monitor-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  monitor-net:
    name: soc-monitor-net
    driver: bridge

volumes:
  prometheus-data:
    name: soc-prometheus-data
  loki-data:
    name: soc-loki-data
  tempo-data:
    name: soc-tempo-data
  grafana-data:
    name: soc-grafana-data
